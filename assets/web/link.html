<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPXS Link</title>
  </head>

  <style>
    body {
      overflow: hidden;
      background-color: black;
      color: white;
      font-family: "Courier New", Courier, monospace;
    }
  </style>
  <body>
    <div style="position: absolute; top: 10%; left: 5%">
      <h2><span style="color: #ff6600">JPXS</span> Account Manager v0.1</h2>
      <h2 id="1" hidden>Linking {{name}} ({{id}})...</h2>
      <h2 id="2" hidden>Error: Found multiple accounts.</h2>
      <h2 id="3" hidden>Please select your account.</h2>

      <ul style="list-style-type: none; padding: 0; margin: 0" id="4" hidden>
        {{list}}
      </ul>
    </div>
  </body>

  <script>
    const elements = [
      document.getElementById("1"),
      document.getElementById("2"),
      document.getElementById("3"),
      document.getElementById("4"),
    ];

    let index = 0;

    function next() {
      elements[index].hidden = false;
      index++;

      setTimeout(() => {
        if (index < elements.length) {
          next();
        }
      }, Math.random() * 500 + 500);
    }

    next();
  </script>
</html>
